[workspace]
resolver = "2"
members = [
    "crates/signbridge-cli",
    "crates/signbridge-host",
]
default-members = [
    "crates/signbridge-cli",
    "crates/signbridge-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hunchbite/signbridge-apps"
authors = ["Hunchbite Technologies Private Limited"]
rust-version = "1.77"

[workspace.dependencies]
# Local side-by-side development (Desktop/Code/signbridge next door).
# CI / published builds: switch to git = "https://github.com/Hunchbite/signbridge"
signbridge = { path = "../signbridge/crates/signbridge", version = "0.1.0" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
